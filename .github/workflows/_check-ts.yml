name: Check TS
run-name: ${{ inputs.task }}

# Reusable TypeScript gate.
on:
  workflow_call:
    inputs:
      task:
        description: Turbo task to run (check, lint, test)
        type: string
        required: true
      timeout:
        description: Job timeout in minutes
        type: number
        required: false
        default: 15

permissions: {}

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `wrangler types` derives the Env interface from .env, which is gitignored.
      # Without it every binding the Worker reads is missing and the typecheck fails.
      - name: Seed Worker env names
        run: cp apps/web/.env.example apps/web/.env

      - name: Restore Turbo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ inputs.task }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ inputs.task }}-
            turbo-${{ runner.os }}-

      - name: Run ${{ inputs.task }}
        env:
          TASK: ${{ inputs.task }}
        run: bunx turbo run "$TASK" --concurrency=100% --continue

      - name: Lint loose scripts
        if: inputs.task == 'lint'
        run: bunx oxlint scripts -c ./oxlint.config.ts --disable-nested-config

      - name: Save Turbo cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ inputs.task }}-${{ github.sha }}
