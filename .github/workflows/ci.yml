name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ts:
              - 'apps/web/**'
              - 'apps/server/**'
              - 'apps/daemon/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'oxlint.config.ts'
              - '.fallowrc.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_check-ts.yml'

  ts-check:
    name: TS typecheck
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    uses: ./.github/workflows/_check-ts.yml
    with:
      task: check

  ts-lint:
    name: TS lint
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    uses: ./.github/workflows/_check-ts.yml
    with:
      task: lint

  ts-test:
    name: TS test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    uses: ./.github/workflows/_check-ts.yml
    with:
      task: test
